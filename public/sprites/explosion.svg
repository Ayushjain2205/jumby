<svg xmlns="http://www.w3.org/2000/svg" width="288" height="48" viewBox="0 0 288 48">
  <!-- Frame 0: Small Flash (x: 0..48) -->
  <g transform="translate(24, 24)">
    <circle r="8" fill="#FFF"/>
    <circle r="5" fill="#FFE066"/>
  </g>
  <!-- Frame 1: Expanding Star (x: 48..96) -->
  <g transform="translate(72, 24)">
    <circle r="14" fill="#F59E0B" opacity="0.8"/>
    <polygon points="0,-16 4,-5 16,-4 7,4 10,16 0,9 -10,16 -7,4 -16,-4 -4,-5" fill="#FFF"/>
    <circle r="6" fill="#EF4444"/>
  </g>
  <!-- Frame 2: Maximum Blast (x: 96..144) -->
  <g transform="translate(120, 24)">
    <circle r="20" fill="#EF4444" opacity="0.5"/>
    <polygon points="0,-22 6,-7 22,-5 10,6 14,22 0,12 -14,22 -10,6 -22,-5 -6,-7" fill="#FBBF24"/>
    <circle r="8" fill="#FFF"/>
    <circle cx="-12" cy="-12" r="3" fill="#FFE066"/>
    <circle cx="14" cy="10" r="3" fill="#FFE066"/>
  </g>
  <!-- Frame 3: Dispersing Sparks (x: 144..192) -->
  <g transform="translate(168, 24)">
    <circle r="12" fill="#EF4444" opacity="0.3"/>
    <circle cx="-16" cy="-14" r="3.5" fill="#F59E0B"/>
    <circle cx="16" cy="14" r="3.5" fill="#F59E0B"/>
    <circle cx="14" cy="-16" r="3" fill="#FFE066"/>
    <circle cx="-14" cy="16" r="3" fill="#FFE066"/>
    <circle cx="0" cy="-18" r="2.5" fill="#FFF"/>
    <circle cx="0" cy="18" r="2.5" fill="#FFF"/>
  </g>
  <!-- Frame 4: Fading Embers (x: 192..240) -->
  <g transform="translate(216, 24)" opacity="0.7">
    <circle cx="-18" cy="-16" r="2.5" fill="#EF4444"/>
    <circle cx="18" cy="16" r="2.5" fill="#EF4444"/>
    <circle cx="17" cy="-18" r="2" fill="#F59E0B"/>
    <circle cx="-17" cy="18" r="2" fill="#F59E0B"/>
  </g>
  <!-- Frame 5: Smoke Rings (x: 240..288) -->
  <g transform="translate(264, 24)" opacity="0.35">
    <circle cx="-20" cy="-18" r="1.5" fill="#AAA"/>
    <circle cx="20" cy="18" r="1.5" fill="#AAA"/>
    <circle cx="18" cy="-20" r="1.5" fill="#AAA"/>
  </g>
</svg>
