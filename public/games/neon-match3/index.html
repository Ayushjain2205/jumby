<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Grid Spark</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script src="/jumby-runtime.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #090717;
      font-family: 'Orbitron', -apple-system, sans-serif;
      display: flex; justify-content: center; align-items: center;
    }
    canvas {
      display: block; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #1c1038 0%, #090717 100%);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Virtual Portrait Resolution
    const V_WIDTH = 390;
    const V_HEIGHT = 844;
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;

      const scaleX = w / V_WIDTH;
      const scaleY = h / V_HEIGHT;
      scale = Math.min(scaleX, scaleY);

      offsetX = (w - V_WIDTH * scale) / 2;
      offsetY = (h - V_HEIGHT * scale) / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // 5 Distinct Vector Gem Types
    const GEM_TYPES = [
      { id: 0, name: 'Cyan Diamond', color: '#00F0FF', shadow: '#00F0FF', shape: 'diamond' },
      { id: 1, name: 'Ruby Core', color: '#FF1744', shadow: '#FF1744', shape: 'heart' },
      { id: 2, name: 'Gold Star', color: '#FFD700', shadow: '#FFD700', shape: 'star' },
      { id: 3, name: 'Emerald Gem', color: '#00E676', shadow: '#00E676', shape: 'hex' },
      { id: 4, name: 'Amethyst', color: '#D500F9', shadow: '#D500F9', shape: 'octagon' },
    ];

    const ROWS = 8;
    const COLS = 8;
    const CELL_SIZE = 43;
    const BOARD_WIDTH = COLS * CELL_SIZE; // 344px
    const BOARD_HEIGHT = ROWS * CELL_SIZE; // 344px
    const BOARD_X = (V_WIDTH - BOARD_WIDTH) / 2; // 23px
    const BOARD_Y = 115; // Clean top margin under minimal HUD

    // Board matrix containing gem objects
    // Each gem: { type: number, x: number, y: number, targetX: number, targetY: number, scale: number, alpha: number }
    let board = [];
    let selectedCell = null;
    let isProcessing = false;
    let score = 0;
    let timeLeft = 60;
    let maxTime = 60;
    let timerInterval = null;
    let state = 'playing'; // Starts directly in PLAYING state — ZERO dim scrim!
    let combo = 0;
    let animQueue = []; // active sliding/falling animations

    function randomType() {
      return Math.floor(Math.random() * GEM_TYPES.length);
    }

    function createGem(type, r, c, startFromTop = false) {
      const targetX = BOARD_X + c * CELL_SIZE + CELL_SIZE / 2;
      const targetY = BOARD_Y + r * CELL_SIZE + CELL_SIZE / 2;
      return {
        type,
        x: targetX,
        y: startFromTop ? BOARD_Y - (ROWS - r) * CELL_SIZE : targetY,
        targetX,
        targetY,
        scale: 1,
        alpha: 1,
      };
    }

    function initBoard() {
      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = createGem(randomType(), r, c, false);
        }
      }

      // Ensure no initial 3-in-a-row
      while (findMatches().length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            board[r][c].type = randomType();
          }
        }
      }
    }

    function findMatches() {
      const matched = new Set();

      // Check horizontal matches
      for (let r = 0; r < ROWS; r++) {
        let matchLen = 1;
        for (let c = 0; c < COLS; c++) {
          const current = board[r][c]?.type;
          const next = c < COLS - 1 ? board[r][c + 1]?.type : null;

          if (current !== undefined && current !== null && current === next) {
            matchLen++;
          } else {
            if (matchLen >= 3) {
              for (let i = 0; i < matchLen; i++) {
                matched.add(`${r},${c - i}`);
              }
            }
            matchLen = 1;
          }
        }
      }

      // Check vertical matches
      for (let c = 0; c < COLS; c++) {
        let matchLen = 1;
        for (let r = 0; r < ROWS; r++) {
          const current = board[r][c]?.type;
          const next = r < ROWS - 1 ? board[r + 1][c]?.type : null;

          if (current !== undefined && current !== null && current === next) {
            matchLen++;
          } else {
            if (matchLen >= 3) {
              for (let i = 0; i < matchLen; i++) {
                matched.add(`${r - i},${c}`);
              }
            }
            matchLen = 1;
          }
        }
      }

      const res = [];
      matched.forEach((key) => {
        const [r, c] = key.split(',').map(Number);
        res.push({ r, c, gem: board[r][c] });
      });
      return res;
    }

    // Universal Level Progression Engine (Score Goal + Bonus Time)
    Jumby.level.init({
      objective: 'score',
      goal: (lvl) => Math.round(450 * Math.pow(lvl, 1.25)), // Lvl 1: 450, Lvl 2: 1070, Lvl 3: 1777...
      onLevelUp: (newLevel) => {
        timeLeft += 15;
        Jumby.fx.addFloatingText('+15s BONUS TIME!', V_WIDTH / 2, 160, '#00F0FF', 16);
        Jumby.awardCoins(2, { item: 'Level Up', icon: '⭐' });
      },
    });

    function restartGame() {
      score = 0;
      timeLeft = 60;
      combo = 0;
      selectedCell = null;
      isProcessing = false;
      Jumby.setScore(0);
      Jumby.level.reset();
      initBoard();
      state = 'playing';
      Jumby.sound.bgm.start('arcade');

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state === 'playing') {
          timeLeft--;
          if (timeLeft <= 0) {
            endGame();
          }
        }
      }, 1000);
    }

    function endGame() {
      state = 'gameover';
      clearInterval(timerInterval);
      Jumby.sound.hit();
      Jumby.fx.shake(16);
      Jumby.gameOver(score);
    }

    // Gem Swapping
    function swapGems(r1, c1, r2, c2) {
      if (isProcessing || state !== 'playing') return;
      isProcessing = true;

      const gem1 = board[r1][c1];
      const gem2 = board[r2][c2];

      // Swap in matrix
      board[r1][c1] = gem2;
      board[r2][c2] = gem1;

      // Update target positions for smooth slide
      gem1.targetX = BOARD_X + c2 * CELL_SIZE + CELL_SIZE / 2;
      gem1.targetY = BOARD_Y + r2 * CELL_SIZE + CELL_SIZE / 2;

      gem2.targetX = BOARD_X + c1 * CELL_SIZE + CELL_SIZE / 2;
      gem2.targetY = BOARD_Y + r1 * CELL_SIZE + CELL_SIZE / 2;

      Jumby.sound.playTone(420, 0.06, 'sine', 0.2);

      // Check matches after slide
      setTimeout(() => {
        const matches = findMatches();
        if (matches.length > 0) {
          combo = 1;
          processMatches(matches);
        } else {
          // Revert swap
          board[r1][c1] = gem1;
          board[r2][c2] = gem2;
          gem1.targetX = BOARD_X + c1 * CELL_SIZE + CELL_SIZE / 2;
          gem1.targetY = BOARD_Y + r1 * CELL_SIZE + CELL_SIZE / 2;
          gem2.targetX = BOARD_X + c2 * CELL_SIZE + CELL_SIZE / 2;
          gem2.targetY = BOARD_Y + r2 * CELL_SIZE + CELL_SIZE / 2;
          Jumby.sound.playTone(180, 0.12, 'sawtooth', 0.25);
          setTimeout(() => {
            isProcessing = false;
          }, 180);
        }
      }, 180);
    }

    function processMatches(matches) {
      const matchScore = matches.length * 60 * combo;
      score += matchScore;
      Jumby.setScore(score);
      Jumby.level.track(score);

      Jumby.sound.score();
      Jumby.fx.shake(5 + Math.min(combo * 3, 12));

      // Burst particles on matched gems
      matches.forEach((m) => {
        const gem = m.gem;
        if (gem) {
          const cfg = GEM_TYPES[gem.type] || GEM_TYPES[0];
          Jumby.fx.particles(gem.x, gem.y, 14, cfg.color);
        }
        board[m.r][m.c] = null;
      });

      // Floating text
      const mid = matches[Math.floor(matches.length / 2)];
      const textX = BOARD_X + (mid ? mid.c : 4) * CELL_SIZE + CELL_SIZE / 2;
      const textY = BOARD_Y + (mid ? mid.r : 4) * CELL_SIZE;

      if (combo > 1) {
        Jumby.fx.addFloatingText(`${combo}X COMBO! +${matchScore}`, textX, textY, '#D8FF43');
        Jumby.sound.powerup();
      } else {
        Jumby.fx.addFloatingText(`+${matchScore}`, textX, textY, '#00F0FF');
      }

      Jumby.awardCoins(1, { item: 'Neon Jewel', icon: '💎' });

      // Gravity fall after delay
      setTimeout(() => {
        applyGravityAndRefill();
      }, 200);
    }

    function applyGravityAndRefill() {
      // 1. Shift downward
      for (let c = 0; c < COLS; c++) {
        let emptyR = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            if (r !== emptyR) {
              board[emptyR][c] = board[r][c];
              board[emptyR][c].targetY = BOARD_Y + emptyR * CELL_SIZE + CELL_SIZE / 2;
              board[r][c] = null;
            }
            emptyR--;
          }
        }

        // 2. Spawn fresh gems from top
        let spawnOffset = 1;
        for (let r = emptyR; r >= 0; r--) {
          const newGem = createGem(randomType(), r, c, false);
          newGem.y = BOARD_Y - spawnOffset * CELL_SIZE;
          newGem.targetY = BOARD_Y + r * CELL_SIZE + CELL_SIZE / 2;
          board[r][c] = newGem;
          spawnOffset++;
        }
      }

      // 3. Check for chain cascade matches
      setTimeout(() => {
        const cascades = findMatches();
        if (cascades.length > 0) {
          combo++;
          processMatches(cascades);
        } else {
          isProcessing = false;
        }
      }, 220);
    }

    // Coordinate Conversion
    function toVirtual(clientX, clientY) {
      return {
        x: (clientX - offsetX) / scale,
        y: (clientY - offsetY) / scale,
      };
    }

    function cellFromVirtual(vx, vy) {
      if (vx < BOARD_X || vx > BOARD_X + BOARD_WIDTH || vy < BOARD_Y || vy > BOARD_Y + BOARD_HEIGHT) {
        return null;
      }
      const c = Math.floor((vx - BOARD_X) / CELL_SIZE);
      const r = Math.floor((vy - BOARD_Y) / CELL_SIZE);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        return { r, c };
      }
      return null;
    }

    let dragStart = null;

    function onPointerDown(e) {
      if (state === 'gameover') {
        restartGame();
        return;
      }
      if (state !== 'playing' || isProcessing) return;

      const p = toVirtual(e.clientX, e.clientY);
      const cell = cellFromVirtual(p.x, p.y);
      if (!cell) return;

      dragStart = { ...cell, startX: p.x, startY: p.y };

      if (!selectedCell) {
        selectedCell = cell;
        Jumby.sound.playTone(520, 0.04, 'sine', 0.15);
      } else {
        const dr = Math.abs(selectedCell.r - cell.r);
        const dc = Math.abs(selectedCell.c - cell.c);

        if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
          // Swap adjacent
          swapGems(selectedCell.r, selectedCell.c, cell.r, cell.c);
          selectedCell = null;
        } else {
          // Select clicked gem
          selectedCell = cell;
          Jumby.sound.playTone(520, 0.04, 'sine', 0.15);
        }
      }
    }

    function onPointerMove(e) {
      if (!dragStart || !selectedCell || isProcessing || state !== 'playing') return;
      const p = toVirtual(e.clientX, e.clientY);
      const dx = p.x - dragStart.startX;
      const dy = p.y - dragStart.startY;
      const dist = Math.hypot(dx, dy);

      if (dist > CELL_SIZE * 0.4) {
        let tr = dragStart.r;
        let tc = dragStart.c;

        if (Math.abs(dx) > Math.abs(dy)) {
          tc += dx > 0 ? 1 : -1;
        } else {
          tr += dy > 0 ? 1 : -1;
        }

        if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
          swapGems(dragStart.r, dragStart.c, tr, tc);
          selectedCell = null;
          dragStart = null;
        }
      }
    }

    function onPointerUp() {
      dragStart = null;
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    // ==========================================
    // VECTOR GEM RENDERING (Crisp, Lush, Glowing)
    // ==========================================
    function drawVectorGem(ctx, typeId, x, y, size, isSelected) {
      ctx.save();
      ctx.translate(x, y);

      const r = size * 0.44;
      const pulse = isSelected ? Math.sin(Date.now() * 0.01) * 3 : 0;
      const activeRadius = r + pulse;

      switch (typeId) {
        // 0: Cyan Prism Diamond
        case 0: {
          ctx.shadowColor = '#00F0FF';
          ctx.shadowBlur = isSelected ? 22 : 12;

          // Main diamond path
          ctx.beginPath();
          ctx.moveTo(0, -activeRadius);
          ctx.lineTo(activeRadius * 0.9, 0);
          ctx.lineTo(0, activeRadius);
          ctx.lineTo(-activeRadius * 0.9, 0);
          ctx.closePath();

          const grad = ctx.createLinearGradient(0, -activeRadius, 0, activeRadius);
          grad.addColorStop(0, '#E0FFFF');
          grad.addColorStop(0.4, '#00F0FF');
          grad.addColorStop(1, '#00838F');
          ctx.fillStyle = grad;
          ctx.fill();

          // Facet specular highlights
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, -activeRadius);
          ctx.lineTo(0, activeRadius);
          ctx.moveTo(-activeRadius * 0.9, 0);
          ctx.lineTo(activeRadius * 0.9, 0);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 1;
          ctx.stroke();
          break;
        }

        // 1: Crimson Ruby
        case 1: {
          ctx.shadowColor = '#FF1744';
          ctx.shadowBlur = isSelected ? 22 : 12;

          ctx.beginPath();
          ctx.moveTo(0, -activeRadius * 0.7);
          ctx.lineTo(activeRadius * 0.8, -activeRadius * 0.3);
          ctx.lineTo(activeRadius * 0.6, activeRadius * 0.8);
          ctx.lineTo(0, activeRadius);
          ctx.lineTo(-activeRadius * 0.6, activeRadius * 0.8);
          ctx.lineTo(-activeRadius * 0.8, -activeRadius * 0.3);
          ctx.closePath();

          const grad = ctx.createRadialGradient(0, -activeRadius * 0.3, 2, 0, 0, activeRadius);
          grad.addColorStop(0, '#FF8A80');
          grad.addColorStop(0.5, '#FF1744');
          grad.addColorStop(1, '#B71C1C');
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Inner facet
          ctx.beginPath();
          ctx.arc(-activeRadius * 0.25, -activeRadius * 0.25, activeRadius * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.fill();
          break;
        }

        // 2: Golden Star
        case 2: {
          ctx.shadowColor = '#FFD700';
          ctx.shadowBlur = isSelected ? 22 : 12;

          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const outerAngle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
            const innerAngle = outerAngle + (2 * Math.PI) / 10;
            const ox = Math.cos(outerAngle) * activeRadius;
            const oy = Math.sin(outerAngle) * activeRadius;
            const ix = Math.cos(innerAngle) * (activeRadius * 0.45);
            const iy = Math.sin(innerAngle) * (activeRadius * 0.45);

            if (i === 0) ctx.moveTo(ox, oy);
            else ctx.lineTo(ox, oy);
            ctx.lineTo(ix, iy);
          }
          ctx.closePath();

          const grad = ctx.createLinearGradient(0, -activeRadius, 0, activeRadius);
          grad.addColorStop(0, '#FFFDE7');
          grad.addColorStop(0.4, '#FFD700');
          grad.addColorStop(1, '#FF8F00');
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          break;
        }

        // 3: Emerald Hexagon
        case 3: {
          ctx.shadowColor = '#00E676';
          ctx.shadowBlur = isSelected ? 22 : 12;

          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            const hx = Math.cos(angle) * activeRadius;
            const hy = Math.sin(angle) * activeRadius;
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();

          const grad = ctx.createRadialGradient(0, -activeRadius * 0.2, 2, 0, 0, activeRadius);
          grad.addColorStop(0, '#B9F6CA');
          grad.addColorStop(0.5, '#00E676');
          grad.addColorStop(1, '#1B5E20');
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          break;
        }

        // 4: Amethyst Octagon
        case 4:
        default: {
          ctx.shadowColor = '#D500F9';
          ctx.shadowBlur = isSelected ? 22 : 12;

          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4 + Math.PI / 8;
            const ox = Math.cos(angle) * activeRadius;
            const oy = Math.sin(angle) * activeRadius;
            if (i === 0) ctx.moveTo(ox, oy);
            else ctx.lineTo(ox, oy);
          }
          ctx.closePath();

          const grad = ctx.createRadialGradient(0, -activeRadius * 0.3, 2, 0, 0, activeRadius);
          grad.addColorStop(0, '#F8BBD0');
          grad.addColorStop(0.5, '#D500F9');
          grad.addColorStop(1, '#4A148C');
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          break;
        }
      }

      ctx.restore();
    }

    // ==========================================
    // MAIN UPDATE & RENDER LOOP
    // ==========================================
    function updatePhysics() {
      // Smooth interpolation for sliding/falling gems
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const gem = board[r]?.[c];
          if (gem) {
            gem.x += (gem.targetX - gem.x) * 0.32;
            gem.y += (gem.targetY - gem.y) * 0.32;
          }
        }
      }
    }

    function render() {
      updatePhysics();

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Play Area Background
      ctx.fillStyle = '#090717';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      // 1. SLEEK 1-ROW MODERN ARCADE HUD (Zero clutter, zero repetition)
      // Left: Time Pill
      const isUrgent = timeLeft <= 10;
      ctx.fillStyle = isUrgent ? 'rgba(255, 23, 68, 0.2)' : 'rgba(20, 14, 41, 0.85)';
      ctx.strokeStyle = isUrgent ? '#FF1744' : '#32235C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(20, 24, 76, 46, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#A78BFA';
      ctx.font = '700 9px "Orbitron", sans-serif';
      ctx.fillText('TIME', 58, 41);
      ctx.fillStyle = isUrgent ? '#FF1744' : '#FFFFFF';
      ctx.font = '900 16px "Orbitron", sans-serif';
      ctx.fillText(`${timeLeft}s`, 58, 60);

      // Center: Level & Goal Progress Pill
      ctx.fillStyle = 'rgba(20, 14, 41, 0.85)';
      ctx.strokeStyle = '#32235C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(104, 24, V_WIDTH - 208, 46, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#D8FF43';
      ctx.font = '900 11px "Orbitron", sans-serif';
      ctx.fillText(`LVL ${Jumby.level.current}`, 118, 42);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#00F0FF';
      ctx.font = '700 10px "Orbitron", sans-serif';
      ctx.fillText(`${score}/${Jumby.level.currentGoal}`, V_WIDTH - 118, 42);

      // Level Progress Bar
      const pBarX = 118;
      const pBarY = 50;
      const pBarW = V_WIDTH - 236;
      const pBarH = 6;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath();
      ctx.roundRect(pBarX, pBarY, pBarW, pBarH, 3);
      ctx.fill();

      const progressW = Math.max(0, Math.min(pBarW, pBarW * Jumby.level.progressRatio));
      if (progressW > 0) {
        ctx.fillStyle = '#00F0FF';
        ctx.shadowColor = '#00F0FF';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.roundRect(pBarX, pBarY, progressW, pBarH, 3);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Right: Score Pill
      ctx.fillStyle = 'rgba(20, 14, 41, 0.85)';
      ctx.strokeStyle = '#32235C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(V_WIDTH - 96, 24, 76, 46, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#A78BFA';
      ctx.font = '700 9px "Orbitron", sans-serif';
      ctx.fillText('SCORE', V_WIDTH - 58, 41);
      ctx.fillStyle = '#D8FF43';
      ctx.font = '900 16px "Orbitron", sans-serif';
      ctx.fillText(`${score}`, V_WIDTH - 58, 60);

      // 2. BRIGHT ARCADE BOARD
      ctx.save();
      ctx.fillStyle = '#110B24';
      ctx.strokeStyle = '#432C7A';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#9945FF';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.roundRect(BOARD_X - 6, BOARD_Y - 6, BOARD_WIDTH + 12, BOARD_HEIGHT + 12, 16);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Checkered grid cells
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cx = BOARD_X + c * CELL_SIZE;
          const cy = BOARD_Y + r * CELL_SIZE;

          ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255, 255, 255, 0.04)' : 'rgba(0, 0, 0, 0.25)';
          ctx.fillRect(cx + 1, cy + 1, CELL_SIZE - 2, CELL_SIZE - 2);

          // Selection Glow Bracket
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 240, 255, 0.28)';
            ctx.fillRect(cx + 2, cy + 2, CELL_SIZE - 4, CELL_SIZE - 4);
            ctx.strokeStyle = '#00F0FF';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#00F0FF';
            ctx.shadowBlur = 12;
            ctx.strokeRect(cx + 2, cy + 2, CELL_SIZE - 4, CELL_SIZE - 4);
            ctx.restore();
          }
        }
      }

      // 3. RENDER ALL GEMS (Lush Vector Graphics)
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const gem = board[r]?.[c];
          if (gem) {
            const isSel = selectedCell && selectedCell.r === r && selectedCell.c === c;
            drawVectorGem(ctx, gem.type, gem.x, gem.y, CELL_SIZE, isSel);
          }
        }
      }

      // 4. JUICE FX LAYER (Particle bursts, floating scores, screenshake)
      Jumby.fx.updateAndRender(ctx, V_WIDTH, V_HEIGHT);

      // 5. GAME OVER MODAL (Only when time expires!)
      if (state === 'gameover') {
        ctx.fillStyle = 'rgba(9, 7, 23, 0.92)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#FF1744';
        ctx.font = '900 34px "Orbitron", sans-serif';
        ctx.shadowColor = '#FF1744';
        ctx.shadowBlur = 18;
        ctx.fillText('TIME UP!', V_WIDTH / 2, 340);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 16px "Orbitron", sans-serif';
        ctx.fillText(`FINAL SCORE: ${score}`, V_WIDTH / 2, 385);

        ctx.fillStyle = '#00F0FF';
        ctx.font = '700 13px "Orbitron", sans-serif';
        ctx.fillText(`CLEARED UP TO LEVEL ${Jumby.level.current}`, V_WIDTH / 2, 412);

        // Play Again Button Card
        ctx.fillStyle = '#D8FF43';
        ctx.beginPath();
        ctx.roundRect(V_WIDTH / 2 - 110, 460, 220, 52, 26);
        ctx.fill();

        ctx.fillStyle = '#090717';
        ctx.font = '900 16px "Orbitron", sans-serif';
        ctx.fillText('PLAY AGAIN', V_WIDTH / 2, 492);
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    restartGame();
    Jumby.ready();
    requestAnimationFrame(render);
  </script>
</body>
</html>
