<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cosmic Slingshot</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script src="/jumby-runtime.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070412; font-family: 'Orbitron', -apple-system, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, #150a2e 0%, #070412 100%); }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Virtual resolution
    const V_WIDTH = 390;
    const V_HEIGHT = 844;
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;

      const scaleX = w / V_WIDTH;
      const scaleY = h / V_HEIGHT;
      scale = Math.min(scaleX, scaleY);

      offsetX = (w - V_WIDTH * scale) / 2;
      offsetY = (h - V_HEIGHT * scale) / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Theme Colors
    const COLORS = {
      primary: '#9945FF',
      cyan: '#00F0FF',
      magenta: '#FF007F',
      lime: '#D8FF43',
      yellow: '#FACC15',
      white: '#FFFFFF',
    };

    // Slingshot anchor
    const SLING_X = 195;
    const SLING_Y = 680;

    // Game state
    let state = 'aiming'; // Starts immediately in aiming mode — ZERO dim scrim!
    let score = 0;
    let launchesLeft = 5;

    // Comet physics object
    const comet = {
      x: SLING_X,
      y: SLING_Y,
      vx: 0,
      vy: 0,
      radius: 12,
      trail: [],
    };

    let crystals = [];
    let blackHoles = [];
    let stars = [];

    // Background starfield
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * V_WIDTH,
        y: Math.random() * V_HEIGHT,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.7 + 0.3,
        speed: Math.random() * 0.3 + 0.1,
      });
    }

    // Universal Level Progression Engine (Targets Cleared + Auto-Persistence)
    Jumby.level.init({
      objective: 'clear_targets',
      persist: 'checkpoint',
      persistKey: 'comet_slingshot',
      goal: (lvl) => Math.min(3 + lvl, 8),
      onLevelUp: (newLevel) => {
        launchesLeft = Math.min(launchesLeft + 3, 7);
        Jumby.awardCoins(2, { item: 'Sector Cleared', icon: '🚀' });
        resetComet();
        spawnLevel();
        state = 'aiming';
      },
    });

    function spawnLevel() {
      crystals = [];
      blackHoles = [];

      const crystalCount = Jumby.level.currentGoal || Math.min(3 + Jumby.level.current, 8);
      for (let i = 0; i < crystalCount; i++) {
        const angle = (i / crystalCount) * Math.PI + 0.2;
        const dist = 120 + Math.random() * 110;
        const cx = V_WIDTH / 2 + Math.cos(angle) * dist;
        const cy = 180 + Math.sin(angle) * 90 + (i % 2) * 50;
        crystals.push({
          x: Math.max(40, Math.min(V_WIDTH - 40, cx)),
          y: Math.max(120, Math.min(420, cy)),
          radius: 18,
          alive: true,
          pulse: Math.random() * Math.PI * 2,
          emoji: ['💎', '💠', '⭐', '🔷'][i % 4],
        });
      }

      // Add 1 or 2 black holes in middle sector
      const bhCount = Math.min(1 + Math.floor((Jumby.level.current - 1) / 2), 3);
      for (let i = 0; i < bhCount; i++) {
        const xSpan = V_WIDTH - 180;
        const posX = bhCount > 1 ? 90 + (i * xSpan) / (bhCount - 1) : V_WIDTH / 2;
        blackHoles.push({
          x: posX + (Math.random() * 20 - 10),
          y: 340 + (Math.random() * 40 - 20),
          radius: 22,
          mass: 2800,
          angle: 0,
        });
      }
    }

    function resetComet() {
      comet.x = SLING_X;
      comet.y = SLING_Y;
      comet.vx = 0;
      comet.vy = 0;
      comet.trail = [];
    }

    function restartGame(keepCheckpoint = true) {
      Jumby.level.reset(keepCheckpoint);
      score = 0;
      launchesLeft = 5;
      Jumby.setScore(0);
      resetComet();
      spawnLevel();
      state = 'aiming';
      Jumby.sound.bgm.start('arcade');
    }

    // Touch & Pointer Drag handling in virtual coordinates
    let isDragging = false;
    let dragPos = { x: SLING_X, y: SLING_Y };

    function toVirtual(clientX, clientY) {
      return {
        x: (clientX - offsetX) / scale,
        y: (clientY - offsetY) / scale,
      };
    }

    function onPointerDown(e) {
      const p = toVirtual(e.clientX, e.clientY);

      if (state === 'gameover') {
        const canResume = Jumby.level.highestLevel > 1;
        if (canResume) {
          // Continue Button (y: 440 to 492)
          if (p.x >= V_WIDTH / 2 - 110 && p.x <= V_WIDTH / 2 + 110 && p.y >= 440 && p.y <= 492) {
            restartGame(true);
            return;
          }
          // Restart Sector 1 Button (y: 506 to 552)
          if (p.x >= V_WIDTH / 2 - 110 && p.x <= V_WIDTH / 2 + 110 && p.y >= 506 && p.y <= 552) {
            restartGame(false);
            return;
          }
        } else {
          // Play Again Button (y: 460 to 514)
          if (p.x >= V_WIDTH / 2 - 110 && p.x <= V_WIDTH / 2 + 110 && p.y >= 460 && p.y <= 514) {
            restartGame(true);
            return;
          }
        }
        return;
      }

      if (state === 'aiming') {
        // Allow pulling from anywhere in bottom half or near slingshot
        const dist = Math.hypot(p.x - SLING_X, p.y - SLING_Y);
        if (dist < 100 || p.y > 540) {
          isDragging = true;
          dragPos = { x: p.x, y: p.y };
          updateCometPull();
          Jumby.sound.playTone(320, 0.04, 'sine', 0.15);
        }
      }
    }

    function onPointerMove(e) {
      if (!isDragging || state !== 'aiming') return;
      const p = toVirtual(e.clientX, e.clientY);
      dragPos = { x: p.x, y: p.y };
      updateCometPull();
    }

    function updateCometPull() {
      const dx = dragPos.x - SLING_X;
      const dy = dragPos.y - SLING_Y;
      const dist = Math.hypot(dx, dy);
      const MAX_PULL = 85;

      if (dist > MAX_PULL) {
        comet.x = SLING_X + (dx / dist) * MAX_PULL;
        comet.y = SLING_Y + (dy / dist) * MAX_PULL;
      } else {
        comet.x = dragPos.x;
        comet.y = dragPos.y;
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;

      if (state === 'aiming') {
        const pullX = SLING_X - comet.x;
        const pullY = SLING_Y - comet.y;
        const pullDist = Math.hypot(pullX, pullY);

        if (pullDist > 18) {
          // Launch!
          const speed = pullDist * 0.28;
          const angle = Math.atan2(pullY, pullX);
          comet.vx = Math.cos(angle) * speed;
          comet.vy = Math.sin(angle) * speed;
          launchesLeft--;
          state = 'flying';
          Jumby.sound.laser();
          Jumby.fx.shake(5);
        } else {
          // Cancel pull
          resetComet();
        }
      }
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    // Update Physics
    function update() {
      // Star twinkling
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > V_HEIGHT) s.y = 0;
      }

      // Black holes rotation
      for (const bh of blackHoles) {
        bh.angle += 0.03;
      }

      if (state === 'flying') {
        // Gravitational attraction toward black holes
        for (const bh of blackHoles) {
          const dx = bh.x - comet.x;
          const dy = bh.y - comet.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);

          if (dist > 8 && dist < 220) {
            const force = bh.mass / (distSq + 400);
            comet.vx += (dx / dist) * force;
            comet.vy += (dy / dist) * force;
          }
        }

        // Apply velocity
        comet.x += comet.vx;
        comet.y += comet.vy;

        // Trail
        comet.trail.push({ x: comet.x, y: comet.y, life: 1 });
        if (comet.trail.length > 18) comet.trail.shift();

        // Particle trail
        if (Math.random() < 0.6) {
          Jumby.fx.particles(comet.x, comet.y, 2, COLORS.cyan);
        }

        // Wall collisions
        const r = comet.radius;
        if (comet.x - r < 10) {
          comet.x = 10 + r;
          comet.vx *= -0.75;
          Jumby.sound.hit();
        } else if (comet.x + r > V_WIDTH - 10) {
          comet.x = V_WIDTH - 10 - r;
          comet.vx *= -0.75;
          Jumby.sound.hit();
        }

        if (comet.y - r < 40) {
          comet.y = 40 + r;
          comet.vy *= -0.75;
          Jumby.sound.hit();
        }

        // Crystal destruction collision
        for (const c of crystals) {
          if (c.alive) {
            const dist = Math.hypot(comet.x - c.x, comet.y - c.y);
            if (dist < comet.radius + c.radius) {
              c.alive = false;
              score += 100 * sector;
              Jumby.setScore(score);
              Jumby.sound.coin();
              Jumby.fx.shake(12);
              Jumby.fx.particles(c.x, c.y, 20, COLORS.magenta);
              Jumby.fx.addFloatingText(`+${100 * sector}`, c.x, c.y - 10, COLORS.yellow);
              Jumby.awardCoins(1, { item: 'Star Gem', icon: '💎' });

              // Deflect comet
              comet.vx *= -0.4;
              comet.vy *= -0.4;

              // Track target clear toward level objective
              const res = Jumby.level.track(1, true);
              if (res) return;
            }
          }
        }

        // Out of bounds or stopped
        const speed = Math.hypot(comet.vx, comet.vy);
        const outOfBounds = comet.y > V_HEIGHT + 20 || comet.x < -40 || comet.x > V_WIDTH + 40;
        const stopped = speed < 0.4 && comet.y < SLING_Y - 40;

        if (outOfBounds || stopped) {
          resetComet();
          if (launchesLeft <= 0) {
            state = 'gameover';
            Jumby.sound.hit();
            Jumby.fx.shake(18);
            Jumby.gameOver(score);
          } else {
            state = 'aiming';
          }
        }
      }
    }

    // Render Scene
    function render() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Apply letterboxing translation & scaling
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Play area boundary
      ctx.fillStyle = '#070412';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      // Starfield
      for (const s of stars) {
        ctx.fillStyle = COLORS.white;
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1.0;

      // Draw Black Holes
      for (const bh of blackHoles) {
        ctx.save();
        // Gravity event horizon rings
        ctx.strokeStyle = COLORS.magenta;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius + 14, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = COLORS.cyan;
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius + 6, bh.angle, bh.angle + Math.PI * 1.5);
        ctx.stroke();

        // Core singularity
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = COLORS.primary;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        Jumby.drawEmoji(ctx, '🕳️', bh.x, bh.y, bh.radius * 1.4);
        ctx.restore();
      }

      // Draw Crystals
      for (const c of crystals) {
        if (c.alive) {
          c.pulse += 0.08;
          const sz = c.radius + Math.sin(c.pulse) * 3;
          ctx.save();
          ctx.shadowColor = COLORS.cyan;
          ctx.shadowBlur = 12;
          Jumby.drawEmoji(ctx, c.emoji, c.x, c.y, sz * 1.8);
          ctx.restore();
        }
      }

      // Draw Slingshot Stand & Bands
      ctx.save();
      ctx.strokeStyle = COLORS.primary;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(SLING_X - 22, SLING_Y + 45);
      ctx.lineTo(SLING_X - 16, SLING_Y);
      ctx.lineTo(SLING_X + 16, SLING_Y);
      ctx.lineTo(SLING_X + 22, SLING_Y + 45);
      ctx.stroke();

      // Slingshot rubber bands
      const isAiming = state === 'aiming' && isDragging;
      ctx.strokeStyle = isAiming ? COLORS.lime : COLORS.cyan;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(SLING_X - 16, SLING_Y);
      ctx.lineTo(comet.x, comet.y);
      ctx.lineTo(SLING_X + 16, SLING_Y);
      ctx.stroke();

      // Aim trajectory dotted arc
      if (isAiming) {
        const pullX = SLING_X - comet.x;
        const pullY = SLING_Y - comet.y;
        const speed = Math.hypot(pullX, pullY) * 0.28;
        const angle = Math.atan2(pullY, pullX);
        let simX = comet.x;
        let simY = comet.y;
        let simVx = Math.cos(angle) * speed;
        let simVy = Math.sin(angle) * speed;

        ctx.fillStyle = COLORS.lime;
        for (let i = 0; i < 22; i++) {
          simX += simVx;
          simY += simVy;
          // Apply black hole gravity prediction
          for (const bh of blackHoles) {
            const dx = bh.x - simX;
            const dy = bh.y - simY;
            const distSq = dx * dx + dy * dy;
            if (distSq > 100 && distSq < 48000) {
              const f = bh.mass / (distSq + 400);
              const d = Math.sqrt(distSq);
              simVx += (dx / d) * f;
              simVy += (dy / d) * f;
            }
          }
          ctx.globalAlpha = Math.max(0, 1 - i / 22);
          ctx.beginPath();
          ctx.arc(simX, simY, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }
      ctx.restore();

      // Draw Comet Trail
      if (comet.trail.length > 1) {
        ctx.save();
        for (let i = 0; i < comet.trail.length - 1; i++) {
          const pt = comet.trail[i];
          const next = comet.trail[i + 1];
          const alpha = (i / comet.trail.length) * 0.7;
          ctx.strokeStyle = COLORS.cyan;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = (i / comet.trail.length) * 8;
          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(next.x, next.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Draw Comet
      ctx.save();
      ctx.shadowColor = COLORS.lime;
      ctx.shadowBlur = 18;
      Jumby.drawEmoji(ctx, '☄️', comet.x, comet.y, comet.radius * 2.4);
      ctx.restore();

      // 1. SLEEK 1-ROW MODERN ARCADE HUD (Zero clutter, zero repetition)
      // Left: Launches Pill
      const isLowLaunches = launchesLeft <= 1;
      ctx.fillStyle = isLowLaunches ? 'rgba(255, 23, 68, 0.2)' : 'rgba(20, 14, 41, 0.85)';
      ctx.strokeStyle = isLowLaunches ? COLORS.magenta : '#32235C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(20, 24, 82, 46, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#A78BFA';
      ctx.font = '700 9px "Orbitron", sans-serif';
      ctx.fillText('LAUNCHES', 61, 41);
      ctx.fillStyle = isLowLaunches ? COLORS.magenta : COLORS.cyan;
      ctx.font = '900 15px "Orbitron", sans-serif';
      ctx.fillText(`☄️ ${launchesLeft}`, 61, 60);

      // Center: Sector & Goal Progress Pill
      ctx.fillStyle = 'rgba(20, 14, 41, 0.85)';
      ctx.strokeStyle = '#32235C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(110, 24, V_WIDTH - 220, 46, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = COLORS.lime;
      ctx.font = '900 11px "Orbitron", sans-serif';
      ctx.fillText(`SECTOR ${Jumby.level.current}`, 124, 42);

      ctx.textAlign = 'right';
      ctx.fillStyle = COLORS.cyan;
      ctx.font = '700 10px "Orbitron", sans-serif';
      ctx.fillText(`💎 ${Math.round(Jumby.level.currentProgress)}/${Jumby.level.currentGoal}`, V_WIDTH - 124, 42);

      // Level Progress Bar
      const pBarX = 124;
      const pBarY = 50;
      const pBarW = V_WIDTH - 248;
      const pBarH = 6;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath();
      ctx.roundRect(pBarX, pBarY, pBarW, pBarH, 3);
      ctx.fill();

      const progressW = Math.max(0, Math.min(pBarW, pBarW * Jumby.level.progressRatio));
      if (progressW > 0) {
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.roundRect(pBarX, pBarY, progressW, pBarH, 3);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Right: Score Pill
      ctx.fillStyle = 'rgba(20, 14, 41, 0.85)';
      ctx.strokeStyle = '#32235C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(V_WIDTH - 102, 24, 82, 46, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#A78BFA';
      ctx.font = '700 9px "Orbitron", sans-serif';
      ctx.fillText('SCORE', V_WIDTH - 61, 41);
      ctx.fillStyle = COLORS.lime;
      ctx.font = '900 16px "Orbitron", sans-serif';
      ctx.fillText(`${score}`, V_WIDTH - 61, 60);

      // FX Layer
      Jumby.fx.updateAndRender(ctx, V_WIDTH, V_HEIGHT);

      // Game Over Screen (Only on Mission Failed!)
      if (state === 'gameover') {
        ctx.fillStyle = 'rgba(7, 4, 18, 0.92)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.textAlign = 'center';
        ctx.fillStyle = COLORS.magenta;
        ctx.font = '900 32px "Orbitron", sans-serif';
        ctx.shadowColor = COLORS.magenta;
        ctx.shadowBlur = 18;
        ctx.fillText('MISSION OVER', V_WIDTH / 2, 330);
        ctx.shadowBlur = 0;

        ctx.fillStyle = COLORS.white;
        ctx.font = '700 16px "Orbitron", sans-serif';
        ctx.fillText(`FINAL SCORE: ${score}`, V_WIDTH / 2, 375);

        ctx.fillStyle = COLORS.cyan;
        ctx.font = '700 13px "Orbitron", sans-serif';
        ctx.fillText(`HIGHEST SECTOR: ${Jumby.level.highestLevel}`, V_WIDTH / 2, 404);

        if (Jumby.level.highestLevel > 1) {
          // Primary Continue Button
          ctx.fillStyle = COLORS.lime;
          ctx.beginPath();
          ctx.roundRect(V_WIDTH / 2 - 110, 440, 220, 52, 26);
          ctx.fill();

          ctx.fillStyle = '#070412';
          ctx.font = '900 15px "Orbitron", sans-serif';
          ctx.fillText(`CONTINUE SECTOR ${Jumby.level.highestLevel}`, V_WIDTH / 2, 472);

          // Secondary Restart Sector 1 Button
          ctx.fillStyle = 'rgba(20, 14, 41, 0.9)';
          ctx.strokeStyle = '#4A3578';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(V_WIDTH / 2 - 110, 506, 220, 46, 23);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#A78BFA';
          ctx.font = '700 13px "Orbitron", sans-serif';
          ctx.fillText('RESTART SECTOR 1', V_WIDTH / 2, 535);
        } else {
          // Play Again Button Card
          ctx.fillStyle = COLORS.lime;
          ctx.beginPath();
          ctx.roundRect(V_WIDTH / 2 - 110, 460, 220, 52, 26);
          ctx.fill();

          ctx.fillStyle = '#070412';
          ctx.font = '900 16px "Orbitron", sans-serif';
          ctx.fillText('PLAY AGAIN', V_WIDTH / 2, 492);
        }
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    restartGame(true);
    Jumby.fx.addFloatingText('DRAG & RELEASE TO LAUNCH!', V_WIDTH / 2, SLING_Y - 50, COLORS.lime, 15);
    Jumby.ready();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
