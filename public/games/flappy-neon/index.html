<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Neon</title>
  <script src="/jumby-sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070714; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 52px; left: 0; right: 0;
      text-align: center; pointer-events: none; z-index: 10;
    }
    .score {
      font-size: 52px; font-weight: 900; color: #fff;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
    }
    #tap-hint {
      position: absolute; bottom: 35%; left: 0; right: 0;
      text-align: center; color: #ff0077; font-size: 18px; font-weight: 700;
      text-shadow: 0 0 10px #ff0077; animation: pulse 1.2s infinite alternate;
      pointer-events: none;
    }
    #gameover-actions {
      display: none; position: absolute; bottom: 18%; left: 50%;
      transform: translateX(-50%); width: 85%; max-width: 320px;
      flex-direction: column; gap: 8px; z-index: 30;
    }
    .action-btn {
      width: 100%; padding: 12px; border-radius: 16px; border: none;
      font-weight: 800; font-size: 13px; cursor: pointer; transition: transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .action-btn:active { transform: scale(0.96); }
    .btn-revive {
      background: linear-gradient(135deg, #10b981, #06b6d4); color: #000;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .btn-shield {
      background: linear-gradient(135deg, #f59e0b, #eab308); color: #000;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }
    .btn-restart {
      background: rgba(255, 255, 255, 0.15); color: #fff; backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    @keyframes pulse { from { opacity: 0.4; transform: scale(0.96); } to { opacity: 1; transform: scale(1.04); } }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score" class="score">0</div>
  </div>
  <div id="tap-hint">TAP TO FLAP</div>

  <div id="gameover-actions">
    <button id="btn-revive" class="action-btn btn-revive">
      <span>📺</span> Watch Ad to Revive
    </button>
    <button id="btn-shield" class="action-btn btn-shield">
      <span>🪙</span> Buy Cyber Shield (20 Coins)
    </button>
    <button id="btn-restart" class="action-btn btn-restart">
      <span>🔄</span> Tap to Restart
    </button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hintEl = document.getElementById('tap-hint');
    const actionsEl = document.getElementById('gameover-actions');
    const btnRevive = document.getElementById('btn-revive');
    const btnShield = document.getElementById('btn-shield');
    const btnRestart = document.getElementById('btn-restart');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'waiting'; // waiting, playing, dead
    let score = 0;
    let frames = 0;

    const player = {
      x: 80,
      y: 0,
      radius: 16,
      vy: 0,
      gravity: 0.38,
      jumpForce: -7.5,
      trail: [],
      hasShield: false,
      invulnerableFrames: 0,
      reset() {
        this.y = height * 0.45;
        this.vy = 0;
        this.trail = [];
        this.hasShield = false;
        this.invulnerableFrames = 0;
      }
    };

    let pipes = [];
    const pipeWidth = 60;
    const pipeGap = 160;
    const pipeSpeed = 3.2;

    function spawnPipe() {
      const minHeight = 60;
      const maxHeight = height - pipeGap - minHeight;
      const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
      pipes.push({
        x: width,
        top: topHeight,
        bottom: height - topHeight - pipeGap,
        passed: false,
        hasCrystal: Math.random() > 0.35,
        crystalY: topHeight + pipeGap / 2,
        crystalCollected: false,
      });
    }

    function jump() {
      if (state === 'waiting') {
        state = 'playing';
        hintEl.style.display = 'none';
        actionsEl.style.display = 'none';
        player.vy = player.jumpForce;
        if (window.Jumby) window.Jumby.sound.jump();
      } else if (state === 'playing') {
        player.vy = player.jumpForce;
        if (window.Jumby) window.Jumby.sound.jump();
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#gameover-actions')) return;
      if (state === 'dead') return;
      jump();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (state === 'dead') resetGame();
        else jump();
      }
    });

    // Rewarded Ad Revive Integration
    btnRevive.addEventListener('click', async () => {
      if (!window.Jumby) return;
      const ad = await window.Jumby.ads.showRewarded();
      if (ad && ad.completed) {
        // Revive player!
        state = 'playing';
        actionsEl.style.display = 'none';
        player.y = height * 0.45;
        player.vy = -4;
        player.invulnerableFrames = 180; // 3 seconds invulnerability
        player.hasShield = true;
        if (window.Jumby.sound) window.Jumby.sound.powerup();
      }
    });

    // In-Game Purchase (Jumby Coins) Integration
    btnShield.addEventListener('click', async () => {
      if (!window.Jumby) return;
      const res = await window.Jumby.payments.buyItem({ item: 'Cyber Shield', priceCoins: 20 });
      if (res) {
        player.hasShield = true;
        btnShield.style.display = 'none';
        if (window.Jumby.sound) window.Jumby.sound.powerup();
      }
    });

    btnRestart.addEventListener('click', () => {
      resetGame();
    });

    function resetGame() {
      score = 0;
      frames = 0;
      scoreEl.textContent = '0';
      hintEl.style.display = 'block';
      hintEl.textContent = 'TAP TO FLAP';
      actionsEl.style.display = 'none';
      btnShield.style.display = 'flex';
      pipes = [];
      player.reset();
      state = 'waiting';
      if (window.Jumby) window.Jumby.setScore(0);
    }

    player.reset();

    function die() {
      // Check if shield absorbs hit
      if (player.hasShield) {
        player.hasShield = false;
        player.invulnerableFrames = 60; // 1 second mercy
        if (window.Jumby) window.Jumby.sound.score();
        return;
      }

      state = 'dead';
      actionsEl.style.display = 'flex';
      hintEl.style.display = 'none';
      if (window.Jumby) {
        window.Jumby.sound.hit();
        window.Jumby.gameOver(score);
      }
    }

    function loop() {
      requestAnimationFrame(loop);
      frames++;

      ctx.fillStyle = '#070714';
      ctx.fillRect(0, 0, width, height);

      // Grid background effect
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      const offsetX = (frames * 1.5) % gridSize;
      for (let x = -offsetX; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      if (state === 'playing') {
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.invulnerableFrames > 0) player.invulnerableFrames--;

        player.trail.push({ x: player.x, y: player.y });
        if (player.trail.length > 12) player.trail.shift();

        if (frames % 100 === 0) spawnPipe();

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= pipeSpeed;

          if (!p.passed && p.x + pipeWidth < player.x) {
            p.passed = true;
            score++;
            scoreEl.textContent = score;
            if (window.Jumby) {
              window.Jumby.setScore(score);
              window.Jumby.sound.score();
            }
          }

          // Collectible Neon Core pickup detection
          if (p.hasCrystal && !p.crystalCollected) {
            const cDist = Math.hypot(player.x - (p.x + pipeWidth / 2), player.y - p.crystalY);
            if (cDist < player.radius + 18) {
              p.crystalCollected = true;
              if (window.Jumby) {
                window.Jumby.awardCoins(1, { item: 'Neon Core', icon: '⚡' });
                window.Jumby.sound.score();
              }
            }
          }

          if (
            player.invulnerableFrames === 0 &&
            player.x + player.radius > p.x &&
            player.x - player.radius < p.x + pipeWidth
          ) {
            if (player.y - player.radius < p.top || player.y + player.radius > height - p.bottom) {
              die();
            }
          }

          if (p.x + pipeWidth < -10) pipes.splice(i, 1);
        }

        if (player.y + player.radius > height || player.y - player.radius < 0) {
          die();
        }
      }

      // Draw Floating Procedural Neon Crystals
      for (const p of pipes) {
        if (p.hasCrystal && !p.crystalCollected) {
          const cx = p.x + pipeWidth / 2;
          const cy = p.crystalY + Math.sin(frames * 0.1) * 6;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(frames * 0.05);
          ctx.shadowBlur = 16;
          ctx.shadowColor = '#D8FF43';
          ctx.fillStyle = '#D8FF43';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(9, 0);
          ctx.lineTo(0, 12);
          ctx.lineTo(-9, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Draw Pipes
      for (const p of pipes) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0077';
        ctx.fillStyle = '#ff0077';
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.fillRect(p.x, height - p.bottom, pipeWidth, p.bottom);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(p.x + 4, 0, 3, p.top);
        ctx.fillRect(p.x + 4, height - p.bottom, 3, p.bottom);
      }

      // Draw Player Trail
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const alpha = (i + 1) / player.trail.length * 0.4;
        const rad = player.radius * ((i + 1) / player.trail.length);
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = `rgba(0, 240, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Cyber Shield Halo
      if (player.hasShield) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#facc15';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw Player
      ctx.shadowBlur = player.invulnerableFrames > 0 ? 30 : 20;
      ctx.shadowColor = player.invulnerableFrames > 0 ? '#ffffff' : '#00f0ff';
      ctx.fillStyle = player.invulnerableFrames > 0 ? '#ffffff' : '#00f0ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#070714';
      ctx.beginPath();
      ctx.arc(player.x + 6, player.y - 3, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    loop();
  </script>
</body>
</html>
